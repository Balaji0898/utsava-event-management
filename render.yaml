# Render Blueprint — one-click backend API + PostgreSQL for Utsava.
# In Render: New + → "Blueprint" → connect the repo → it reads this file.
# After deploy, set APP_URL and CORS_ORIGIN (see DEPLOYMENT.md).

databases:
  - name: utsava-db
    databaseName: utsava
    user: utsava
    plan: free

services:
  - type: web
    name: utsava-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/departments
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: utsava-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900s
      - key: JWT_REFRESH_TTL
        value: 7d
      # Set these two in the Render dashboard AFTER the first deploy,
      # once you know the API URL (APP_URL) and the Vercel site URL (CORS_ORIGIN).
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Optional — set these to persist image uploads on Cloudinary
      # (local disk is ephemeral on Render/Railway and is wiped on redeploy).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
