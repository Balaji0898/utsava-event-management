name: E2E Neon branch GC

# Sweeps orphaned `e2e/*` Neon branches.
#
# This is not belt-and-braces — it is load bearing. The cleanup step in e2e.yml runs under
# `if: always()`, which does NOT fire when a runner is hard-cancelled or times out. Neon's free
# plan caps branches per project, so one leak per cancelled run bricks the project within days.
#
# Required repo secrets: NEON_API_KEY, NEON_PROJECT_ID (see e2e.yml for where to find them).
#
# Only ever touches branches whose name starts with `e2e/` and that are older than
# E2E_BRANCH_TTL_HOURS (default 6). Never the primary or default branch.

on:
  schedule:
    # Every six hours. Long enough that it can never race a running suite (the whole workflow
    # is capped at 45 minutes), frequent enough that a leak cannot accumulate.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ttl_hours:
        description: 'Delete e2e/* branches older than this many hours'
        required: false
        default: '6'

jobs:
  gc:
    name: Reap stale branches
    runs-on: ubuntu-latest
    steps:
      - name: Check the Neon secrets are configured
        id: guard
        run: |
          if [ -n "${{ secrets.NEON_API_KEY }}" ] && [ -n "${{ secrets.NEON_PROJECT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (Neon secrets not set)
        if: steps.guard.outputs.ok != 'true'
        run: echo "::warning::NEON_API_KEY / NEON_PROJECT_ID not set — nothing to reap."

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        if: steps.guard.outputs.ok == 'true'
        working-directory: e2e
        run: npm ci

      - name: Reap
        if: steps.guard.outputs.ok == 'true'
        working-directory: e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          E2E_BRANCH_TTL_HOURS: ${{ github.event.inputs.ttl_hours || '6' }}
        run: npm run db:gc
