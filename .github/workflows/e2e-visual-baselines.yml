name: E2E visual baselines

# Regenerates the committed visual-regression baselines on a Linux runner and opens a PR with
# the result.
#
# Manual only, on purpose. Baselines are byte-sensitive to font rasterisation, so they are
# committed for LINUX ONLY and a developer run on macOS/Windows skips screenshot comparison
# entirely (`ignoreSnapshots` in playwright.config.ts). That means the only way to iterate on a
# visual spec is through this workflow — which is the accepted trade-off, since Docker is not
# available on the maintainer's machine.
#
# Review the diff in the PR before merging: an accepted baseline is an accepted UI change.
#
# No secrets or external services are required — the stack renders against a throwaway Postgres
# service container, the same way e2e.yml runs the suite. See that file's header for why the
# seeded admin password can default.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional Playwright --grep filter, e.g. "VIS-V-14"'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  baselines:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Named `utsava_e2e` so it satisfies both positive tests in e2e/scripts/lib/guard.mjs —
    # a local host AND an `e2e` marker — rather than relying on either alone.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utsava_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d utsava_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Every lockfile must be listed: there is no package.json at the repo root, so a bare
      # `cache: npm` cannot resolve one and fails the step outright.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Regenerate the baselines
        working-directory: e2e
        env:
          CI: 'true'
          E2E_DB_MODE: external
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/utsava_e2e
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'e2e-ci-throwaway-admin-pw' }}
          # Via env, not interpolated into the script: a workflow_dispatch input spliced
          # straight into `run:` is a shell-injection vector, even when only maintainers
          # can dispatch it.
          GREP: ${{ github.event.inputs.grep }}
        run: |
          ARGS=(--project=visual --update-snapshots)
          if [ -n "$GREP" ]; then
            ARGS+=("--grep=$GREP")
          fi
          node scripts/run-e2e.mjs "${ARGS[@]}"

      - name: Open a pull request with the new baselines
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/e2e-visual-baselines
          title: 'chore(e2e): regenerate visual baselines'
          commit-message: 'chore(e2e): regenerate visual baselines'
          body: |
            Regenerated by the **E2E visual baselines** workflow.

            **Review the image diffs before merging** — every changed baseline is an accepted UI
            change. If a diff is unexpected, the UI regressed and this PR should be closed rather
            than merged.

            Baselines are Linux-only by design; see the note at the top of
            `e2e/tests/visual/public.visual.spec.ts`.
          add-paths: |
            e2e/tests/**/__screenshots__/**
