name: E2E (Playwright)

# Boots an ephemeral full stack inside the runner against a throwaway Postgres service
# container, then runs the Playwright suite (UI E2E + API contract + security regression +
# a11y + visual) against localhost. Nothing here can reach the production database.
#
# NO SECRETS OR EXTERNAL SERVICES ARE REQUIRED. The database is a container that lives and
# dies with the job, so the suite runs on a fresh clone with zero configuration. This
# replaced a Neon branch-per-run setup, which needed NEON_API_KEY + NEON_PROJECT_ID and so
# never actually ran; it also needed a scheduled reaper, because a hard-cancelled runner
# leaked a branch against the free plan's per-project quota. A container needs none of that.
#
# Each shard gets its OWN container and seeds it independently. That costs one extra
# migrate+seed per shard, but against localhost the seed's ~60 unbatched creates are far
# cheaper than the TLS round-trips they cost against Neon — and it buys real isolation:
# previously all three shards shared one database, so a `@mutates` spec in one shard could
# perturb the row counts another shard asserted on.
#
# Optional repo secrets:
#   E2E_ADMIN_PASSWORD → overrides the seeded SUPER_ADMIN password. It has a default below,
#                        which is safe precisely because this database is unreachable from
#                        outside the runner and is destroyed with the job. Any value the seed
#                        accepts must be >= 8 chars (backend/prisma/seed.ts otherwise
#                        generates a random one and prints it only once, which CI cannot
#                        read back).
#
# Optional repo variables:
#   E2E_BLOCKING = 'true' → a failing suite fails the workflow. Default: warn only, so this
#                           can land without blocking the current push-to-main deploys.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# A newer push supersedes an in-flight run, on every branch including main. The old workflow
# deliberately never cancelled on main, because cancelling skipped the Neon branch deletion
# and leaked quota. With a service container there is nothing left to leak.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Boot a stack per shard against that shard's own Postgres, and run the suite.
  # ---------------------------------------------------------------------------
  test:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Reachable on 127.0.0.1 because the job's steps run directly on the runner rather than
    # inside a container. The database is named `utsava_e2e` so it satisfies the disposability
    # guard in e2e/scripts/lib/guard.mjs by BOTH of its positive tests — a local host and an
    # `e2e` marker in the name — rather than relying on either alone.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utsava_e2e
        ports:
          - 5432:5432
        # GitHub gates the first step on these probes, so no explicit wait step is needed.
        options: >-
          --health-cmd "pg_isready -U postgres -d utsava_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Every lockfile must be listed: there is no package.json at the repo root, so the bare
      # `cache: npm` this job used before could not resolve one and failed the step outright.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # ALL THREE engines, not just chromium. playwright.config.ts declares firefox,
      # webkit, mobile-safari (webkit) and mobile-chrome (chromium) projects, and
      # run-e2e.mjs passes only `--shard=`, no `--project=` filter — so a shard can be
      # handed any project. Installing chromium alone failed those specs with
      # "browserType.launch: Executable doesn't exist at .../webkit-2272".
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit

      # The Next build dominates wall-clock (three, @react-three, framer-motion and tiptap),
      # so cache it across runs keyed on the frontend sources.
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      # `run-e2e.mjs` owns the whole lifecycle: migrate + seed the container, build and boot
      # backend + frontend, health-gate both, run Playwright, then stop the stack. It picks
      # `external` mode from E2E_DB_MODE and takes the URL from E2E_DATABASE_URL; the JWT and
      # revalidate secrets are generated per run inside scripts/stack.mjs, so none are needed
      # here.
      - name: Run the suite
        working-directory: e2e
        env:
          CI: 'true'
          E2E_DB_MODE: external
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/utsava_e2e
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'e2e-ci-throwaway-admin-pw' }}
        run: node scripts/run-e2e.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.shard }}
          path: |
            e2e/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Merge the shard reports and publish the summary.
  # ---------------------------------------------------------------------------
  report:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          path: e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report and one JSON file
        working-directory: e2e
        run: |
          # `test-results/` is gitignored, so it does NOT exist in a fresh checkout and the
          # redirect below has nowhere to write. The previous `|| true` then swallowed that
          # failure, and the error surfaced two steps later as a baffling "Playwright JSON
          # results not found" from the summary generator. Create it, and let a real merge
          # failure fail the step instead of hiding it.
          mkdir -p test-results
          # merge-reports writes the HTML to playwright-report/ and the JSON to stdout.
          npx playwright merge-reports --reporter html,json ./all-blob-reports \
            > test-results/e2e-results.json

      # Also enforces the known-vulnerability ratchet: the count may fall freely but never rise
      # without someone deliberately raising the baseline in e2e/known-vulnerabilities.json.
      - name: Generate the markdown summary and check the security ratchet
        working-directory: e2e
        env:
          # Only enforced here, after every shard has been merged. A single shard sees a fraction
          # of the suite, so comparing its vulnerability count to the baseline would be meaningless.
          E2E_ENFORCE_RATCHET: '1'
        run: npm run report

      - name: Generate the standalone HTML summary
        working-directory: e2e
        run: npm run report:html || true

      - name: Upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/e2e-summary.md
            e2e/test-results/e2e-report.html
          retention-days: 14

      # Default is warn-only so the suite can land without blocking today's push-to-main flow.
      # Flip the E2E_BLOCKING repo variable to 'true' once it has been green for a few days.
      - name: Gate the workflow on the result
        if: ${{ needs.test.result != 'success' }}
        run: |
          if [ "${{ vars.E2E_BLOCKING }}" = "true" ]; then
            echo "::error::The E2E suite failed and E2E_BLOCKING is enabled."
            exit 1
          fi
          echo "::warning::The E2E suite failed. Set the E2E_BLOCKING repo variable to 'true' to make this fail the build."
